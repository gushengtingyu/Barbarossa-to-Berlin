	</select>

<h3 class="settings-title" data-i18n="create.optional_rules">选规</h3>

	<span class="option-help">

	</span>
</p>

<p>
	<label><input type="checkbox" value="true" name="allied_2_24_exclusive_1941" data-optional-rule data-default-enabled checked disabled /> <span data-i18n="create.rule.reinforcement">1941年苏军增援限制</span></label>
	<span class="option-help">
		<button type="button" class="option-help-button" aria-describedby="reinforcement_rule_help" aria-label="查看苏军增援限制说明" data-i18n-aria-label="create.rule.reinforcement_help_label">?</button>
		<span class="option-help-popup" id="reinforcement_rule_help" role="tooltip" data-i18n="create.rule.reinforcement_help">1941年内，盟军第2号与第24号苏军增援事件只能打出其中一张；另一张仍可作非事件用途使用。</span>

<p>
	<label><input type="checkbox" value="true" name="moscow_trench_axis_rp" data-optional-rule /> <span data-i18n="create.rule.moscow_axis_rp">AX+2RP</span></label>
	<span class="option-help">
		<button type="button" class="option-help-button" aria-describedby="moscow_axis_rp_rule_help" aria-label="查看莫斯科战壕与德国军备说明" data-i18n-aria-label="create.rule.moscow_axis_rp_help_label">?</button>
		<span class="option-help-popup" id="moscow_axis_rp_rule_help" role="tooltip" data-i18n="create.rule.moscow_axis_rp_help">莫斯科初始拥有一个战壕，【施佩尔】和【总体战】获得每回合GERP+1的效果</span>
	</span>
</p>

<p>
	<label><input type="checkbox" value="true" name="no_invasions_before_summer_42" data-optional-rule data-default-enabled checked disabled /> <span data-i18n="create.rule.invasion">1942年夏季前禁止盟军入侵</span></label>
	<span class="option-help">
		<button type="button" class="option-help-button" aria-describedby="early_invasion_rule_help" aria-label="查看盟军早期入侵限制说明" data-i18n-aria-label="create.rule.invasion_help_label">?</button>
		<span class="option-help-popup" id="early_invasion_rule_help" role="tooltip" data-i18n="create.rule.invasion_help">盟军在1942年夏季回合前不得将登陆牌作为入侵事件打出。</span>
	</span>

<p>
	<label><input type="checkbox" value="true" name="time_of_mud" data-optional-rule data-default-enabled checked disabled /> <span data-i18n="create.rule.mud">泥泞时节</span></label>
	<span class="option-help">
		<button type="button" class="option-help-button" aria-describedby="mud_rule_help" aria-label="查看泥泞时节说明" data-i18n-aria-label="create.rule.mud_help_label">?</button>

<p>
	<label><input type="checkbox" value="true" name="sunny_italy" data-optional-rule data-default-enabled checked disabled /> <span data-i18n="create.rule.italy">意大利晴空</span></label>
	<span class="option-help">
		<button type="button" class="option-help-button" aria-describedby="italy_rule_help" aria-label="查看意大利晴空说明" data-i18n-aria-label="create.rule.italy_help_label">?</button>
		<span class="option-help-popup" id="italy_rule_help" role="tooltip" data-i18n="create.rule.italy_help">秋季与冬季回合中，那不勒斯作为补给源时只提供有限补给。</span>

<script src="/barbarossa-to-berlin/modules/core/i18n_catalog.js"></script>
<script src="/barbarossa-to-berlin/modules/core/i18n.js"></script>
<script>
	const localeControl = document.getElementById("ui_locale")
	const readSavedLocale = () => {
		try {
			return localStorage.getItem("btb.ui_locale")
		} catch {
			return null
		}
	}
	const storeLocale = (locale) => {
		try {
			localStorage.setItem("btb.ui_locale", locale)
		} catch {
			// Storage can be unavailable in privacy-restricted browser contexts.
		}
	}
	const savedLocale = readSavedLocale()
	if (savedLocale === "en" || savedLocale === "zh-CN") localeControl.value = savedLocale
	const applyLocale = () => {
		storeLocale(localeControl.value)
		BTBI18N.setLocale(localeControl.value)
		BTBI18N.translateDocument(document)
	}
	localeControl.addEventListener("change", () => {
		storeLocale(localeControl.value)
		location.reload()
	})

	const scenario = document.querySelector("select[name='scenario']")
	if (scenario) {
		const updateScenarioInfo = () => {
			document.querySelectorAll(".scenario_info").forEach((element) => element.classList.remove("show"))
			document.getElementById(scenario.value)?.classList.add("show")
		}
		scenario.addEventListener("change", updateScenarioInfo)
		updateScenarioInfo()
	} else {
		document.getElementById("Campaign")?.classList.add("show")
	}
	const disableOptionalRules = document.querySelector("input[name='disable_optional_rules']")
	const optionalRuleControls = document.querySelectorAll("input[data-optional-rule]")
	const updateOptionalRules = () => {
		for (const control of optionalRuleControls) {
			const defaultEnabled = control.hasAttribute("data-default-enabled")
			control.checked = !disableOptionalRules.checked && defaultEnabled
			control.disabled = disableOptionalRules.checked || defaultEnabled
		}
	}
	disableOptionalRules.addEventListener("change", updateOptionalRules)
	updateOptionalRules()
	applyLocale()
</script>
